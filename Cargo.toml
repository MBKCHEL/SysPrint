[package]
name = "sysprint"
version = "4.6.3"
edition = "2024"
license = "GPL-3.0-only"
authors = ["MBKCHEL"]

[dependencies]
sysinfo = "0.40.3"
colored = "3.1.1"
strip-ansi-escapes = "0.2.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
dirs = "7.0.0"
chrono = "0.4.45"
argh = "0.1.19"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
