[package]
name = "sysprint"
version = "3.9.0"
edition = "2024"

[dependencies]
sysinfo = "0.39.6"
pci-ids = "0.2.6"
colored = "3.1.1"
strip-ansi-escapes = "0.2.1"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
dirs = "6.0.0"
chrono = "0.4.45"
serde_json = "1.0.151"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
