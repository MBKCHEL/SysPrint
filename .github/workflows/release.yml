name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sysprint-linux
            binary_name: sysprint
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sysprint-windows
            binary_name: sysprint.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sysprint-macos
            binary_name: sysprint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary before upload
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/
          if [ "${{ matrix.binary_name }}" = "sysprint.exe" ]; then
            mv sysprint.exe sysprint-windows.exe
          else
            mv sysprint ${{ matrix.artifact_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}*

  build-freebsd:
    name: Build for FreeBSD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust git
          run: |
            cargo build --release
            mv target/release/sysprint target/release/sysprint-freebsd

      - name: Upload FreeBSD artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysprint-freebsd
          path: target/release/sysprint-freebsd

  build-android:
    name: Build for Android (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android binary
        run: cargo ndk -t aarch64-linux-android -p 29 -- build --release

      - name: Rename binary
        run: |
          mv target/aarch64-linux-android/release/sysprint target/aarch64-linux-android/release/sysprint-android-aarch64

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysprint-android-aarch64
          path: target/aarch64-linux-android/release/sysprint-android-aarch64

  release:
    needs: [build, build-freebsd, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
