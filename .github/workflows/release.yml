name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sysprint-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sysprint-windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sysprint-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            target/${{ matrix.target }}/release/sysprint
            target/${{ matrix.target }}/release/sysprint.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            sysprint-linux/sysprint
            sysprint-windows.exe/sysprint.exe
            sysprint-macos/sysprint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}