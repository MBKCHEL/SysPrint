name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sysprint-linux
            binary_name: sysprint
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sysprint-windows
            binary_name: sysprint.exe
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sysprint-macos
            binary_name: sysprint
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            artifact_name: sysprint-freebsd
            binary_name: sysprint
            use_cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Rename binary before upload
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/
          if [ "${{ matrix.binary_name }}" = "sysprint.exe" ]; then
            mv sysprint.exe sysprint-windows.exe
          else
            mv sysprint ${{ matrix.artifact_name }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}*

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
